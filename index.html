<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فرم ثبت‌نام حرفه‌ای | SUPREME REGISTER</title>
    <link rel="stylesheet" href="register.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- پس‌زمینه متحرک -->
    <div class="animated-bg">
      <div class="circle1"></div>
      <div class="circle2"></div>
      <div class="circle3"></div>
    </div>

    <!-- فرم اصلی -->
    <div class="form-container">
      <div class="form-card">
        <div class="form-header">
          <img src="logo1.png" alt="لوگوی من" class="site-logo">
          <div class="icon-badge">✨</div>
          <h2>ثبت‌نام حرفه‌ای</h2>
          <p>لطفاً اطلاعات خود را دقیق وارد کنید</p>
        </div>

        <form
          action="https://formspree.io/f/mvzyjgkj"
          method="post"
          id="registerForm"
        >
          <input type="hidden" name="_subject" value="اطلاعات جدید از سایت" />
          <input
            type="hidden"
            name="_replyto"
            value="amir.dilmaghani85@gmail.com"
          />

          <!-- فیلد نام -->
          <div class="input-group">
            <label>👤 نام و نام خانوادگی</label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="مثال: امیر دیلمقانی"
              autocomplete="off"
            />
            <div class="error-msg" id="nameError"></div>
          </div>

          <!-- فیلد موبایل -->
          <div class="input-group">
            <label>📱 شماره موبایل</label>
            <input
              type="tel"
              name="mobile"
              id="mobile"
              placeholder="09123456789"
            />
            <div class="error-msg" id="mobileError"></div>
          </div>

          <!-- فیلد ایمیل -->
          <div class="input-group">
            <label>📧 آدرس ایمیل</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="example@gmail.com"
            />
            <div class="error-msg" id="emailError"></div>
          </div>

          <!-- فیلد سن -->
          <div class="input-group">
            <label>🎂 سن</label>
            <input
              type="number"
              name="age"
              id="age"
              placeholder="مثال: 25"
              min="1"
              max="120"
            />
            <div class="error-msg" id="ageError"></div>
          </div>

          <div class="row-two">
            <!-- تاریخ -->
            <div class="input-group half">
              <label>📅 تاریخ</label>
              <input type="date" name="date" id="date" />
              <div class="error-msg" id="dateError"></div>
            </div>

            <!-- زمان -->
            <div class="input-group half">
              <label>⏰ زمان</label>
              <input type="time" name="time" id="time" />
              <div class="error-msg" id="timeError"></div>
            </div>
          </div>

          <!-- انتخاب مقدار -->
          <div class="input-group">
            <label>🔢 عدد مورد نظر</label>
            <select name="selectNumber" id="selectNumber">
              <option value="">انتخاب کنید</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </div>

          <!-- انتخاب رنگ -->
          <div class="input-group">
            <label>🎨 رنگ مورد علاقه</label>
            <select name="favoriteColor" id="favoriteColor">
              <option value="">انتخاب کنید</option>
              <option value="Red">🔴 قرمز</option>
              <option value="Blue">🔵 آبی</option>
              <option value="Green">🟢 سبز</option>
              <option value="Yellow">🟡 زرد</option>
              <option value="Black">⚫ مشکی</option>
              <option value="Orange">🟠 نارنجی</option>
            </select>
          </div>

          <!-- علاقه‌مندی‌ها -->
          <div class="input-group">
            <label>❤️ علاقه‌مندی‌ها</label>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" name="cinema" id="cinema" /> 🎬 سینما
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="football" id="football" /> ⚽
                فوتبال
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="volleyball" id="volleyball" /> 🏐
                والیبال
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="cook" id="cook" /> 🍳 آشپزی
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="farming" id="farming" /> 🌱 کشاورزی
              </label>
              <label class="checkbox-label">
                <input type="checkbox" name="game" id="game" /> 🎮 بازی
              </label>
            </div>
          </div>

          <!-- جنسیت -->
          <div class="input-group">
            <label>👫 جنسیت</label>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="gender" value="Male" /> 👨 مرد
              </label>
              <label class="radio-label">
                <input type="radio" name="gender" value="Female" /> 👩 زن
              </label>
            </div>
            <div class="error-msg" id="genderError"></div>
          </div>

          <!-- دکمه ارسال -->
          <button type="submit" id="submitBtn">
            <span class="btn-text">🚀 ارسال اطلاعات</span>
            <span class="btn-loader"></span>
          </button>
        </form>

        <div class="footer-note">
          <button type="button" class="hello-btn" id="helloBtn">
            👋 کلیک کن
          </button>
        </div>
      </div>
    </div>

    <script src="register.js"></script>
  </body>
</html>
